<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>ACE777 COCKPIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; color:#e9e4d4; font-family:'Share Tech Mono',monospace; overflow-x:hidden; }
    
    /* === HEADER === */
    .header { display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:#111; border-bottom:1px solid #222; }
    .header .logo { font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700; color:#7cff6b; }
    .header .clock { font-size:12px; color:#888; }
    
    /* === TOP BAR (indicateurs) === */
    .top-bar { display:flex; gap:4px; padding:6px 12px; background:#0d0d0d; flex-wrap:wrap; }
    .chip { background:#1a1a1a; border:1px solid #2a2a2a; padding:5px 10px; border-radius:4px; text-align:center; min-width:70px; }
    .chip.active { border-color:#7cff6b; }
    .chip.alert { border-color:#ff5c5c; animation: blink 1s infinite; }
    .chip .lab { font-size:8px; color:#666; text-transform:uppercase; letter-spacing:1px; }
    .chip .val { font-size:16px; font-weight:bold; margin:2px 0; }
    .chip .sub { font-size:9px; color:#555; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    
    /* === LECTURE (résumé) === */
    .lecture { padding:12px 16px; font-size:11px; line-height:1.7; color:#999; background:#0d0d0d; border-top:1px solid #1a1a1a; max-height:400px; overflow-y:auto; }
    .lecture .line { padding:3px 0; border-bottom:1px solid #111; }
    .lecture .line:last-child { color:#7cff6b; font-weight:bold; border-bottom:none; }
    .lecture .line.warn { color:#ffd24d; }
    .lecture .line.danger { color:#ff5c5c; }
    
    /* === FOOTER === */
    .footer { padding:6px 16px; font-size:10px; color:#444; background:#0a0a0a; border-top:1px solid #1a1a1a; display:flex; justify-content:space-between; }
    .footer .status { display:flex; gap:12px; }
    .footer .dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:3px; }
    .footer .dot.ok { background:#7cff6b; }
    .footer .dot.warn { background:#ffd24d; }
    .footer .dot.err { background:#ff5c5c; }
    
    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:#111; }
    ::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">ACE777</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="top-bar">
    <div class="chip" id="c-poussiere"><div class="lab">POUSSIÈRE</div><div class="val" id="v-poussiere">—</div><div class="sub" id="v-poussiere-sub"></div></div>
    <div class="chip" id="c-sdi"><div class="lab">SDI</div><div class="val" id="v-sdi">—</div><div class="sub" id="v-sdi-sub"></div></div>
    <div class="chip" id="c-rbf"><div class="lab">RBF</div><div class="val" id="v-rbf">—</div><div class="sub" id="v-rbf-sub"></div></div>
    <div class="chip" id="c-health"><div class="lab">HEALTH</div><div class="val" id="v-health">—</div><div class="sub" id="v-health-sub"></div></div>
    <div class="chip" id="c-gain"><div class="lab">GAIN RÉEL</div><div class="val" id="v-gain">—</div><div class="sub" id="v-gain-sub"></div></div>
    <div class="chip" id="c-geopol"><div class="lab">GEOPOL</div><div class="val" id="v-geopol">—</div><div class="sub" id="v-geopol-sub"></div></div>
  </div>

  <div class="lecture" id="lecture"></div>

  <div class="footer">
    <div class="status">
      <span><span class="dot ok" id="dot-thermo"></span>THERMO</span>
      <span><span class="dot ok" id="dot-cockpit"></span>COCKPIT</span>
      <span><span class="dot ok" id="dot-cortana"></span>CORTANA</span>
    </div>
    <div id="foot-ts">—</div>
  </div>

  <script src="live.js"></script>
  <script>
    // === CLOCK ===
    function tickClock(){
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR');
    }
    tickClock();
    setInterval(tickClock, 1000);

    // === RENDER FUNCTIONS ===
    function color(val, thresholds){
      if(val >= thresholds[0]) return '#ff5c5c';
      if(val >= thresholds[1]) return '#ffd24d';
      return '#7cff6b';
    }

    function renderSDI(){
      const sdi = (T && T.sdi) || {};
      const ipt = (T && T.ipt) || {};
      const v = document.getElementById('v-sdi');
      const c = document.getElementById('c-sdi');
      if(!v) return;
      const val = sdi.sdi;
      v.textContent = (val!=null) ? Number(val).toFixed(3) : '—';
      if(val!=null){
        v.style.color = color(val, [0.7, 0.3]);
        if(val > 0.7) c.classList.add('alert');
      }
      const sub = document.getElementById('v-sdi-sub');
      if(sub) sub.textContent = 'IPT ' + ((ipt.ipt||0).toFixed(2));
    }

    function renderRBF(){
      const rbf = (T && T.rbf) || {};
      const v = document.getElementById('v-rbf');
      const c = document.getElementById('c-rbf');
      if(!v) return;
      const val = rbf.rbf_score;
      v.textContent = (val!=null) ? Number(val).toFixed(1) : '—';
      if(val!=null){
        v.style.color = color(val, [1.5, 1.0]);
        if(val > 1.5) c.classList.add('alert');
      }
    }

    function renderHealth(){
      const h = (T && T.pipeline_health) || {};
      const v = document.getElementById('v-health');
      const c = document.getElementById('c-health');
      if(!v) return;
      const val = h.global_score;
      v.textContent = (val!=null) ? Number(val).toFixed(2) : '—';
      if(val!=null){
        v.style.color = val >= 0.85 ? '#7cff6b' : (val >= 0.6 ? '#ffd24d' : '#ff5c5c');
        if(val < 0.85) c.classList.add('warn');
        if(val < 0.6) c.classList.add('alert');
      }
      const sub = document.getElementById('v-health-sub');
      if(sub) sub.textContent = (h.mode_label || '') + (h.position_multiplier < 1 ? ' ×'+h.position_multiplier.toFixed(1) : '');
    }

    function renderPoussiere(){
      const oc = (T && T.onchain) || {};
      const v = document.getElementById('v-poussiere');
      const c = document.getElementById('c-poussiere');
      if(!v) return;
      const val = oc.cpfpDustScore;
      v.textContent = (val!=null) ? Number(val).toFixed(1) : '—';
      if(val!=null){
        v.style.color = color(val, [30, 15]);
        if(val > 30) c.classList.add('alert');
      }
      const sub = document.getElementById('v-poussiere-sub');
      if(sub) sub.textContent = (oc.cpfpMode || '') + ' · blocs:' + ((oc.blocPrivatiseTauxFantome||0).toFixed(1)) + '%';
    }

    function renderGain(){
      const ace = (T && T.ace) || {};
      const v = document.getElementById('v-gain');
      if(!v) return;
      const val = ace.sessionPnl;
      if(val!=null){
        v.textContent = (val<0?'-':'+') + Math.abs(val).toFixed(1) + '$';
        v.style.color = val > 0 ? '#7cff6b' : '#ff5c5c';
      }
      const sub = document.getElementById('v-gain-sub');
      if(sub) sub.textContent = 'heat ' + (ace.heat||0).toFixed(0) + '% · ' + (ace.trades||0) + ' fills';
    }

    function renderGeopol(){
      const v = document.getElementById('v-geopol');
      const s = document.getElementById('v-geopol-sub');
      const c = document.getElementById('c-geopol');
      const g = (T && T.geopol) || {};
      if(!v) return;
      const score = g.score;
      if(score!=null){
        v.textContent = (g.emoji||'') + ' ' + Number(score).toFixed(2);
        v.style.color = color(score, [0.8, 0.3]);
        if(score >= 0.6) c.classList.add('alert');
      }
      if(s){
        const ml = g.ml || {};
        let txt = (g.niveau||'').toUpperCase();
        if(ml.label_nom) txt += ' · ML:' + ml.label_nom;
        txt += ' · ' + (g.nb_ok||0) + '/5';
        s.textContent = txt;
      }
    }

    function renderLecture(){
      const div = document.getElementById('lecture');
      if(!div) return;
      const lecture = T.lecture || [];
      div.innerHTML = lecture.map(l => {
        let cls = 'line';
        if(l.includes('GEOPOL')) cls += ' warn';
        if(l.includes('⚠️') || l.includes('ERREUR')) cls += ' danger';
        return '<div class="' + cls + '">' + l + '</div>';
      }).join('');
    }

    function renderFooter(){
      const ts = T.ts || '—';
      document.getElementById('foot-ts').textContent = 'FEED ' + ts;
      const trio = T.trioStatus || {};
      document.getElementById('dot-thermo').className = 'dot ' + (trio.thermo==='OK'?'ok':'err');
      document.getElementById('dot-cockpit').className = 'dot ok';
      document.getElementById('dot-cortana').className = 'dot ' + (trio.cortana==='OK'?'ok':'err');
    }

    // === PAINT ALL ===
    function paintAll(){
      const T = window.__THERMO__ || {};
      renderSDI();
      renderRBF();
      renderHealth();
      renderPoussiere();
      renderGain();
      renderGeopol();
      renderLecture();
      renderFooter();
    }

    paintAll();

    // Auto-refresh toutes les 30s
    setInterval(()=>{
      const s = document.createElement('script');
      s.src = 'live.js?t=' + Date.now();
      s.onload = ()=>{ paintAll(); };
      s.onerror = ()=>{};
      document.head.appendChild(s);
    }, 30000);
  </script>
</body>
</html>
